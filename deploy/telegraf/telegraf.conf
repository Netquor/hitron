[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = true

# The exporter emits Influx line protocol on stdout, so Telegraf needs no
# plugin beyond inputs.exec. One exec per device family keeps one failure from
# losing the others.
[[inputs.exec]]
  commands = ["/opt/hitron/bin/hitron-exporter --coda60 ${CODA60_HOST} --once --format telegraf"]
  timeout = "25s"
  data_format = "influx"
  interval = "30s"
  name_suffix = ""

[[inputs.exec]]
  commands = ["/opt/hitron/bin/hitron-exporter --coda57 ${CODA57_HOST} --once --format telegraf"]
  timeout = "25s"
  data_format = "influx"
  interval = "30s"

[[inputs.exec]]
  commands = ["/opt/hitron/bin/hitron-exporter --ht-em5 ${HT_EM5_HOST} --once --format telegraf"]
  timeout = "25s"
  data_format = "influx"
  interval = "30s"

# Pick one output. InfluxDB v2:
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "home"
  bucket = "hitron"

# Or Prometheus remote write:
# [[outputs.prometheus_client]]
#   listen = ":9273"
