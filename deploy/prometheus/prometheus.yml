global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: hitron

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: hitron
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["exporter:9877"]
        labels:
          stack: local

  # If you already run hitron-exporter outside compose, scrape it directly:
  # - job_name: hitron-host
  #   static_configs:
  #     - targets: ["192.168.1.10:9877"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
