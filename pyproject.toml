[project]
name = "hitron"
version = "0.2.0"
description = "Golden source for Hitron HT-EM5 / CODA60 / CODA57: client libraries, OpenAPI specs, and a unified Prometheus metrics exporter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private - Netquor internal" }
dependencies = [
    "aiohttp>=3.9",
    "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hitron = "hitron.cli:main"
hitron-exporter = "hitron.exporter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hitron"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
