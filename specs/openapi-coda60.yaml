                  enable: {type: string}
                additionalProperties: true
          additionalProperties: true
    TelemetryDeviceInfo:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            device_id: {type: string}
            mso: {type: string}
            hw_model: {type: string}
            hw_manufacturer: {type: string}
            hardware_version: {type: string}
            software_version: {type: string}
            serial_number: {type: string}
            parent: {type: string}
            connect_type: {type: string}
          additionalProperties: true
    RfMetrics:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            mac: {type: string}
            timestamp: {type: string}
            status: {type: string}
            ds_channel: {type: string}
            us_channel: {type: string}
            ds_ofdm_channel: {type: string}
            us_ofdma_channel: {type: string}
          additionalProperties: true
    Pnm:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            mac: {type: string}
            timestamp: {type: string}
            rxmer: {type: string}
            ch_est_coef: {type: string}
            us_pre_eq: {type: string}
            mod_prof: {type: string}
          additionalProperties: true
    ManageInfo:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            adminUsername: {type: string}
            username: {type: string}
          additionalProperties: true
    MutationResult:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            success: {type: boolean}
            message: {type: string}
            error: {type: string}
          additionalProperties: true
    RegisterRequest:
      type: object
      required: [appid, seckey]
      properties:
        appid:
          type: string
          description: Vendor application identifier.
        seckey:
          type: string
          description: RS256 JWT, signed by Hitron, containing `jti`, `iss=Hitron`, `vendor`, and `model`.
    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            token: {type: string}
            appid: {type: string}
          additionalProperties: true
  requestBodies:
    ModelBody:
      required: true
      description: |
        Firmware reads `POST["model"]` and `json_decode`s it. Send the JSON as
        a form field named `model`, or as a raw JSON body. Include
        `"_method":"PUT"|"DELETE"|"PATCH"` to tunnel a verb through POST.
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [model]
            properties:
              model:
                type: string
                description: JSON-encoded request document.
                example: '{"ruleOnOff":"1"}'
        application/json:
          schema:
            type: object
            additionalProperties: true
paths:
  /1/Device/Menu/{menu}:
    get:
      tags: [Menu]
      operationId: getMenu
      summary: Return the navigation tree.
      parameters:
        - $ref: '#/components/parameters/Menu'
        - $ref: '#/components/parameters/Callback'
      responses:
        '200':
          description: Menu entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MenuResponse'}
              examples:
                main:
                  value:
                    errCode: "000"
                    errMsg: ""
                    Menu_List:
                      - {index: 1, tagName: Status, langTagId: Status, visible: true, selected: false, hyperLink: status_overview}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-hitron-controller: MenuCreater
  /1/Device/Users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List local users.
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      Users_List:
                        type: array
                        items: {$ref: '#/components/schemas/User'}
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a local user.
      requestBody: {$ref: '#/components/requestBodies/ModelBody'}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a local user.
      parameters:
        - name: id
          in: query
          schema: {type: string}
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
      x-hitron-controller: UserAction
  /1/Device/Users/{action}:
    parameters:
      - $ref: '#/components/parameters/Action'
    get:
      tags: [Users]
      operationId: userActionGet
      summary: Read a login/user helper.
      description: |
        `action` is one of `LoginStatus`, `LoginConfig`, `CSRF`, `Name`,
        `Namecheck`, `Type`, `Manage`, `PswdReset`, `MsoAuth`. The same route
        accepts POST for state-changing actions.
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [LoginStatus, LoginConfig, CSRF, Name, Namecheck, Type, Manage, PswdReset, MsoAuth]
      responses:
        '200':
          description: Action result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
    post:
      tags: [Users]
      operationId: userActionPost
      summary: Login, logout, and account actions.
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [Login, Logout, LoginStatus, LoginConfig, CSRF, Name, Namecheck, Type, Manage, PswdReset, MsoAuth, Password]
      requestBody:
        description: |
          For `Login`, send `{"username":"admin","password":"..."}`. For
          `Logout`, the body may be omitted. Other actions take the fields the
          matching page submits (`name`, `available`, `check_pswd`, `fwLevel`,
          `gender`, `icon`, `idleTime`, `ip`, `kplgin`, `mac`).
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                model: {type: string, description: JSON-encoded document}
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Action result; login sets `PHPSESSID`.
          headers:
            Set-Cookie:
              schema: {type: string}
              description: Session cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-hitron-controller: UserAction
  /1/Device/Users/{action}/{id}:
    parameters:
      - $ref: '#/components/parameters/Action'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Users]
      operationId: userActionById
      summary: Act on one user instance.
      requestBody: {$ref: '#/components/requestBodies/ModelBody'}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
    delete:
      tags: [Users]
      operationId: deleteUserById
      summary: Delete one user instance.
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
  /1/Device/CM/Version:
    get:
      tags: [CM]
      operationId: getCmVersion
      summary: Model, hardware, software, and serial number.
      responses:
        '200':
          description: Version block.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceVersion'}
      x-hitron-auth-exempt: true
  /1/Device/CM/DocsisProvision:
    get:
      tags: [CM]
      operationId: getDocsisProvision
      summary: DOCSIS provisioning state machine.
      responses:
        '200':
          description: Provisioning steps.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocsisProvision'}
              examples:
                provisioned:
                  value:
                    errCode: "000"
                    errMsg: ""
                    hwInit: Success
                    findDownstream: Success
                    ranging: Success
                    dhcp: Success
                    timeOfday: Success
                    downloadCfg: Success
                    registration: Success
                    bpiStatus: "AUTH:authorized, TEK:operational"
  /1/Device/CM/SysInfo:
    get:
      tags: [CM]
      operationId: getCmSysInfo
      summary: CM WAN address, lease, and configuration file.
      responses:
        '200':
          description: CM system info.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CmSysInfo'}
  /1/Device/CM/DsInfo:
    get:
      tags: [CM]
      operationId: getDsInfo
      summary: SC-QAM downstream channels.
      responses:
        '200':
          description: Downstream channel list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DsInfoResponse'}
              examples:
                channel:
                  value:
                    errCode: "000"
                    errMsg: ""
                    Freq_List:
                      - portId: 25
                        frequency: "267000000"
                        modulation: "2"
                        signalStrength: "8.098"
                        snr: "43.377"
                        channelId: "1"
                        dsoctets: "34 * 2e32   1203911172"
                        correcteds: "0"
                        uncorrect: "0"
  /1/Device/CM/UsInfo:
    get:
      tags: [CM]
      operationId: getUsInfo
      summary: SC-QAM / ATDMA upstream channels.
      responses:
        '200':
          description: Upstream channel list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsInfoResponse'}
  /1/Device/CM/DsOfdm:
    get:
      tags: [CM]
      operationId: getDsOfdm
      summary: OFDM downstream channels, including PLC/NCP/MDC1 lock.
      responses:
        '200':
          description: OFDM downstream list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DsOfdmResponse'}
  /1/Device/CM/UsOfdm:
    get:
      tags: [CM]
      operationId: getUsOfdm
      summary: OFDMA upstream channels.
      responses:
        '200':
          description: OFDMA upstream list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsOfdmResponse'}
  /1/Device/CM/Log:
    get:
      tags: [CM]
      operationId: getCmLog
      summary: DOCSIS event log.
      responses:
        '200':
          description: Event log.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocsisLogResponse'}
  /1/Device/CM/LTEBackup:
    get:
      tags: [CM]
      operationId: getLteBackup
      summary: LTE backup dongle and APN state.
      responses:
        '200':
          description: LTE backup block.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LteBackup'}
  /1/Device/CM/Ready:
    get:
      tags: [CM]
      operationId: getCmReady
      summary: Poll whether the gateway finished booting.
      responses:
        '200':
          description: Ready state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /1/Device/CM/Reboot:
    post:
      tags: [CM]
      operationId: rebootOrReset
      summary: Reboot, factory reset, or immediate reset (destructive).
      description: |
        **Real device action.** The body selects the behaviour:

        | Body | Effect |
        | --- | --- |
        | `{"reboot":1}` | Sets `Device.DeviceInfo.X_HITRON_COM_MGMT.Reboot=true`; a backend process acts on it. |
        | `{"factoryReset":1}` | Sets `FactoryResult=true`; destroys configuration. |
        | `{"restoreReset":1}` | The handler itself runs `sync; ncpu_exec -e ht_reset_cmd.sh reboot; reboot`. Immediate and irreversible. |

        No confirmation layer exists on the device; the exporter never calls this.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                model: {type: string, example: '{"reboot":1}'}
          application/json:
            schema:
              type: object
              properties:
                reboot: {type: integer, enum: [1]}
                factoryReset: {type: integer, enum: [1]}
                restoreReset: {type: integer, enum: [1]}
      responses:
        '200':
          description: Action accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MutationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-hitron-destructive: true
      x-hitron-controller: ModelInfo
  /1/Device/Router/SysInfo:
    get:
      tags: [Router]
      operationId: getRouterSysInfo
      summary: Gateway hardware, firmware, serial, RF MAC, and uptime.
