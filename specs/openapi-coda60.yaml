                  hostID: {type: string}
                  typeID: {type: string}
                  resultID: {type: string}
                  SSID_ID: {type: string}
                  detail: {type: string}
                  extra: {type: string}
                additionalProperties: true
          additionalProperties: true
    HealthSettings:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            rssiThre: {type: string}
          additionalProperties: true
    SpectrumFreqList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Freq_List:
              type: array
              items:
                type: object
                properties:
                  portId: {type: integer}
                  frequency: {type: string}
                additionalProperties: true
          additionalProperties: true
    SpectrumFreqPower:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Power_List:
              type: array
              items:
                type: object
                properties:
                  frequency: {type: number}
                  power: {type: number}
                additionalProperties: true
          additionalProperties: true
    SpectrumRtData:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            RTData_List:
              type: array
              items:
                type: object
                properties:
                  frequency: {type: number}
                  power: {type: number}
                additionalProperties: true
          additionalProperties: true
    SpectrumConstellation:
      allOf:
        - $ref: '#/components/schemas/Envelope'
