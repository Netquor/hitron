      tags: [Router]
      operationId: updatePortForward
      summary: Update a port-forward rule.
      requestBody: {$ref: '#/components/requestBodies/ModelBody'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
    delete:
      tags: [Router]
      operationId: deletePortForward
      summary: Delete a port-forward rule.
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
  /1/Device/Router/PortTrigger:
    get:
      tags: [Router]
