      summary: Create a port-trigger rule.
      requestBody: {$ref: '#/components/requestBodies/ModelBody'}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
  /1/Device/Router/PortTrigger/Status:
    get:
      tags: [Router]
      operationId: getPortTriggerStatus
      summary: Port-trigger runtime status.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortTriggerStatus'}
  /1/Device/Router/PortTrigger/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Router]
      operationId: updatePortTrigger
      summary: Update a port-trigger rule.
      requestBody: {$ref: '#/components/requestBodies/ModelBody'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
    delete:
      tags: [Router]
      operationId: deletePortTrigger
      summary: Delete a port-trigger rule.
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
  /1/Device/Docsis/{info}:
    get:
      tags: [CM]
      operationId: getDocsisLegacy
      summary: Legacy DOCSIS route (declared but unimplemented in this build).
      description: |
        `routes.ini` maps this route to `DocsisInfo`, but no `DocsisInfo.php`
        exists in the analyzed firmware, so the route resolves to a 404. Kept
        in the spec so clients do not mistake the absence for a transport
        error.
      parameters:
