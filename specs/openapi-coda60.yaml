        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
  /1/Device/Upload:
    post:
      tags: [API]
      operationId: uploadConfig
      summary: Upload a `.cfg` file to `/var/tmp`.
      description: |
        Accepts one multipart field named `file`. Only the `.cfg` extension is
        allowed. Returns `{"error":0,"name":"..."}` on success. This endpoint
        writes to the device filesystem; treat it as destructive.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    oneOf: [{type: integer}, {type: string}]
                  name: {type: string}
      x-hitron-destructive: true
  /1/Device/Manage:
    get:
      tags: [Manage]
      operationId: getManage
      summary: Current admin username.
      responses:
        '200':
          description: Manage block.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManageInfo'}
  /1/Device/Manage/{info}:
    parameters:
      - name: info
        in: path
        required: true
        schema:
          type: string
          enum: [Info, Password, Username]
    get:
      tags: [Manage]
      operationId: getManageInfo
      summary: Read one credential sub-resource.
      responses:
        '200':
          description: Credential metadata (never the stored secret).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManageInfo'}
  /1/Device/Manage/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [Password, Username]
    post:
      tags: [Manage]
      operationId: changeCredentials
      summary: Change the admin password or username.
      description: |
        `Password` expects `oldPassword`, `newPassword`,
        `newPasswordConfirm`, and optional `newUsername`. `Username` expects
        `newUsername`. Both write straight through to TR-181.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                model:
                  type: string
                  example: '{"oldPassword":"admin","newPassword":"...","newPasswordConfirm":"..."}'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MutationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-hitron-destructive: true
      x-hitron-controller: AdminPassword
  /telemetry/{info}:
    parameters:
      - name: info
        in: path
        required: true
        schema:
          type: string
          enum: [deviceinfo, rfmetrics, pnm]
    get:
      tags: [Telemetry]
      operationId: getTelemetry
      summary: "ISP telemetry: device identity, RF metrics, or PNM summary."
      responses:
        '200':
          description: Telemetry payload.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TelemetryDeviceInfo'
                  - $ref: '#/components/schemas/RfMetrics'
                  - $ref: '#/components/schemas/Pnm'
        '401':
          description: Invalid sub-resource; the controller forces a 401 to avoid leaking shell paths.
  /telemetry/pnm/{sub}:
    parameters:
      - name: sub
        in: path
        required: true
        schema:
          type: string
          enum: [rxmer, ch_est_coef, us_pre_eq, mod_prof]
    get:
      tags: [Telemetry]
      operationId: getPnmDetail
      summary: Per-subcarrier PNM data.
      responses:
        '200':
          description: PNM detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pnm'}
        '401':
          description: Invalid sub-resource.
