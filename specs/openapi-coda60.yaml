  /1/Device/API/Register:
    post:
      tags: [API]
      operationId: registerApp
      summary: Exchange a signed vendor JWT for an app token.
      description: |
        Validates `seckey` as an RS256 JWT signed by Hitron, checks `iss ==
        "Hitron"`, `jti`, `vendor` membership in
        `Device.X_HITRON_COM_App.VendorList`, and returns a token stored under
        `Device.X_HITRON_COM_App.TokenList`. Use it as
        `Ht-App-Auth: base64(appid:appuser)`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                model: {type: string}
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
      x-hitron-auth-exempt: true
