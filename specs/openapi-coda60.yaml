              schema: {$ref: '#/components/schemas/PortForwardRules'}
    post:
      tags: [Router]
      operationId: createPortForward
      summary: Create a port-forward rule.
      requestBody: {$ref: '#/components/requestBodies/ModelBody'}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
  /1/Device/Router/PortForward/Status:
