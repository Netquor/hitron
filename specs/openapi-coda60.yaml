        HttpPort: {type: string}
        HttpsRuleOnOff: {type: string}
        HttpsPort: {type: string}
        SshRuleOnOff: {type: string}
        SshPort: {type: string}
        TelnetRuleOnOff: {type: string}
        TelnetPort: {type: string}
