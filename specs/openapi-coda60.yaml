openapi: 3.0.3
info:
  title: Hitron CODA6X Console API (CODA-60 / CODA-57 class)
  version: 8.5.0.0.3b2
  description: |
    Complete, reverse-engineered description of the Hitron CODA6X console API
    (`/1/Device/...` and `/telemetry/...`) as served by the Fat-Free Framework
    PHP application in front of the RDK-B `cosa.so` TR-181 data model.

    **Provenance.** Derived from a signed CODA-60-class firmware image:
    `app/routes.ini`, every controller in `app/controllers/`, every model in
    `app/models/`, and live responses from a seeded mock of the same
    application. It is not official Hitron documentation. Field names and
    casing are reproduced exactly as the firmware emits them, including typos
    such as `Raidos_List` and `theroy_tx`.

    **Envelope.** Every JSON response is the controller's `output` array merged
    with `errCode` and `errMsg` (`Controller::afterroute`). `errCode == "000"`
    means success. Any other code sets HTTP 400 unless the request carried an
    app session. Because PHP merges with `+`, payload keys win over the
    envelope keys on collision.

    **Request encoding.** Controllers read `POST["model"]`, a JSON *string*.
    Send `application/x-www-form-urlencoded` with one field named `model`
    whose value is the JSON document, or send the JSON document directly when
    the controller also reads `BODY` (`/1/Device/API/Register`). A JSON body
    may include `"_method": "PUT" | "DELETE" | "PATCH"` to tunnel that verb
    through POST (`Controller::fake_restful`).

    **Auth.** In the analyzed build `check_session()` and `check_security()`
    are commented out, so read routes answer without a session. The code still
    contains three header branches: `Ht-App-Auth` (base64 `appid:appuser`
    vendor token), `Cloud-Check-Api`, and `Lib-Rest-Api`. A normal browser
    session is a `PHPSESSID` cookie obtained from `POST /1/Device/Users/Login`.
    Treat the three header schemes as vendor integration hooks, not as a
    security boundary you can rely on.

    **JSONP.** Any route accepts `?callback=fn` and wraps the response in
    `fn(...)` with `Content-Type: application/Javascript`.

    **Errors.** Unknown parameters return `{"errCode":"001","errMsg":"Invalid
    Paramters."}` (the misspelling is the firmware's) with HTTP 400. A method
    the controller does not implement returns `errCode "005"`.

    **Trailing-slash quirk.** `/1/Device/Manage ` is registered with a trailing
    space in `routes.ini`; clients should use `/1/Device/Manage` and accept the
    router's normalisation.
  license:
    name: Private - Netquor internal
    url: https://github.com/Netquor/hitron
  contact:
    name: Netquor
    url: https://github.com/Netquor/hitron
servers:
  - url: http://192.168.100.1
    description: Factory-default LAN address of a CODA6X gateway.
  - url: http://coda6x.local
    description: mDNS name used by some ISP builds.
  - url: http://127.0.0.1:8080
    description: The seeded mock bundled with the reverse-engineering workspace.
tags:
  - name: Menu
    description: Navigation tree used by the web UI.
  - name: Users
    description: Login, logout, users, and CSRF helpers.
  - name: CM
    description: Cable modem, DOCSIS provisioning, RF channels, logs, and reboot.
  - name: Router
    description: Gateway system info, port forwarding, and port triggering.
  - name: MTA
    description: Embedded multimedia terminal adapter (voice lines).
  - name: WiFi
    description: Radios, SSIDs, clients, access control, WPS, hotspot, and survey.
  - name: Hosts
    description: LAN host table and per-host firewall level.
  - name: DHCP
    description: LAN DHCP server and reservations.
  - name: WAN
    description: WAN addressing and DNS.
  - name: MoCA
    description: MoCA coax bridge configuration and status.
  - name: DDNS
    description: Dynamic DNS client.
  - name: Firewall
    description: Firewall level, filters, logs, and VPN passthrough.
  - name: Diagnostics
    description: Ping and traceroute.
  - name: System
    description: Time, advanced switch, USB, BBU, and remote management.
  - name: Network
    description: IP passthrough, GRE, VLAN, RIP, static routes, and IP mapping.
  - name: Spectrum
    description: DOCSIS spectrum analyser and constellation data.
  - name: Telemetry
    description: Device info, RF metrics, and PNM telemetry consumed by ISP tooling.
  - name: Manage
    description: Admin credentials.
  - name: API
    description: Vendor app registration and file upload.
x-tagGroups:
  - name: Status and RF
    tags: [CM, Router, MTA, Spectrum, Telemetry]
  - name: LAN and wireless
    tags: [WiFi, Hosts, DHCP, WAN, MoCA, DDNS, Network]
  - name: Security and system
    tags: [Firewall, Diagnostics, System, Manage, Users, Menu, API]
security:
  - cookieAuth: []
  - appToken: []
  - cloudApi: []
  - libApi: []
  - {}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Session cookie set by `POST /1/Device/Users/Login`.
    appToken:
      type: apiKey
      in: header
      name: Ht-App-Auth
      description: Base64 of `appid:appuser`, issued by `POST /1/Device/API/Register`.
    cloudApi:
      type: apiKey
      in: header
      name: Cloud-Check-Api
      description: ISP cloud integration marker; the branch is present but empty in this build.
    libApi:
      type: apiKey
      in: header
      name: Lib-Rest-Api
      description: Library integration marker; the session-app flag it used to set is commented out.
  parameters:
    Menu:
      name: menu
      in: path
      required: true
      schema:
        type: string
        enum: [Main, Sub]
    Info:
      name: info
      in: path
      required: true
      schema:
        type: string
      description: Controller-specific selector. See each operation for the accepted values.
    InfoCM:
      name: info
      in: path
      required: true
      schema:
        type: string
        enum: [Version, DocsisProvision, SysInfo, UsInfo, DsInfo, DsOfdm, UsOfdm, Log, LTEBackup, Ready]
    Action:
      name: action
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Instance identifier from the corresponding list endpoint.
    IfName:
      name: ifname
      in: path
      required: true
      schema:
        type: string
      description: Wireless interface name, e.g. `wlan0`, `wl0`, `wl1`, or an SSID index depending on build.
    Index:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: 1-based radio index.
    Callback:
      name: callback
      in: query
      required: false
      schema:
        type: string
      description: JSONP callback name. Response becomes `callback(json)`.
    PortId:
      name: portId
      in: query
      required: true
      schema:
        type: integer
      description: Downstream port identifier from `CM/DsInfo`.
    CentFreq:
      name: centFreq
      in: query
      required: true
      schema:
        type: number
        format: float
      description: Centre frequency in MHz.
    FromFreq:
      name: fromFreq
      in: query
      required: true
      schema:
        type: number
        format: float
      description: Start frequency in MHz.
    ToFreq:
      name: toFreq
      in: query
      required: true
      schema:
        type: number
        format: float
      description: End frequency in MHz.
    ModelForm:
      name: model
      in: query
      required: false
      schema:
        type: string
      description: JSON-encoded request document. Firmware reads this from the form body; documented here for completeness.
  responses:
    BadRequest:
      description: |
        Validation or dispatch failure. The body still uses the JSON envelope;
        `errCode` is `"001"` for invalid parameters, `"005"` for an
        unsupported method, and other controller-specific codes exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          examples:
            invalidParameter:
              value:
                errCode: "001"
                errMsg: Invalid Paramters.
    Unauthorized:
      description: Login required, or the session expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
  schemas:
    Envelope:
      type: object
      description: Base response envelope merged into every payload.
      required: [errCode, errMsg]
      properties:
        errCode:
          type: string
          description: '`"000"` on success.'
          example: "000"
        errMsg:
          type: string
          example: ""
      additionalProperties: true
    MenuItem:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            index: {type: integer}
            mainIndex: {type: integer}
            subIndex: {type: integer}
            tagName: {type: string}
            langTagId: {type: string}
            visible: {type: boolean}
            selected: {type: boolean}
            hyperLink: {type: string}
          additionalProperties: true
    MenuResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Menu_List:
              type: array
              items: {$ref: '#/components/schemas/MenuItem'}
          additionalProperties: true
    User:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            user_id: {type: string}
            user_name: {type: string}
            curr_uid: {type: string}
            available: {type: string}
          additionalProperties: true
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            success: {type: boolean}
            uid: {type: string}
            role: {type: string}
          additionalProperties: true
    DeviceVersion:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            modelName: {type: string, example: CODA-60}
            vendorName: {type: string, example: Hitron}
            hwVersion: {type: string, example: "1A"}
            swVersion: {type: string, example: 8.5.0.0.3b2}
            serialNumber: {type: string, example: AN50258036AE}
            deploymentName: {type: string}
          additionalProperties: true
    RouterSysInfo:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            hwVersion: {type: string, example: "1A"}
            swVersion: {type: string, example: 8.5.0.0.3b2}
            serialNumber: {type: string, example: AN50258036AE}
            systemTime: {type: string, example: "Mon Apr 27, 2026, 15:07:57"}
            rfMac: {type: string, example: "B0:F5:30:87:C8:7C"}
            systemUptime: {type: string, example: "134h:54m:33s"}
          additionalProperties: true
    CmSysInfo:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            ntAccess: {type: string, example: Permitted}
            ip: {type: string, example: "10.33.143.251 / 10.33.143.251"}
            subMask: {type: string, example: 255.255.192.0}
            gw: {type: string, example: 10.33.128.1}
            lease: {type: string, example: "D: 05 H: 00 M: 00 S: 00"}
            Configname: {type: string, example: CBR8_Bundle2_Default-1.cfg}
          additionalProperties: true
    DocsisProvision:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            hwInit: {type: string, example: Success}
            findDownstream: {type: string, example: Success}
            ranging: {type: string, example: Success}
            dhcp: {type: string, example: Success}
            timeOfday: {type: string, example: Success}
            downloadCfg: {type: string, example: Success}
            registration: {type: string, example: Success}
            bpiStatus: {type: string, example: "AUTH:authorized, TEK:operational"}
            eaeStatus: {type: string}
          additionalProperties: true
    DsChannel:
      type: object
      description: One SC-QAM downstream channel.
      properties:
        portId: {type: integer, example: 25}
        frequency: {type: string, description: Hz, example: "267000000"}
        modulation: {type: string, example: "2"}
        signalStrength: {type: string, description: dBmV, example: "8.098"}
        snr: {type: string, description: dB, example: "43.377"}
        channelId: {type: string, example: "1"}
        dsoctets: {type: string, example: "34 * 2e32   1203911172"}
        correcteds: {type: string, example: "0"}
        uncorrect: {type: string, example: "0"}
      additionalProperties: true
    DsInfoResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Freq_List:
              type: array
              items: {$ref: '#/components/schemas/DsChannel'}
          additionalProperties: true
    UsChannel:
      type: object
      description: One SC-QAM / ATDMA upstream channel.
      properties:
        portId: {type: string, example: "1"}
        frequency: {type: string, description: Hz, example: "14000000"}
        modtype: {type: string, example: 64QAM}
        signalStrength: {type: string, description: dBmV, example: "31.000"}
        bandwidth: {type: string, description: Hz, example: "6400000"}
        channelId: {type: string, example: "10"}
        scdmaMode: {type: string, example: ATDMA}
      additionalProperties: true
    UsInfoResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Freq_List:
              type: array
              items: {$ref: '#/components/schemas/UsChannel'}
          additionalProperties: true
    DsOfdmChannel:
      type: object
      description: One OFDM downstream channel. `index` is what the UI plots.
      properties:
        receive: {type: string}
        ffttype: {type: string, example: 4K}
        Subcarr0freqFreq: {type: string, description: Hz, example: "296600000"}
        plclock: {type: string, enum: [YES, NO]}
        ncplock: {type: string, enum: [YES, NO]}
        mdc1lock: {type: string, enum: [YES, NO]}
        plcpower: {type: string, description: dBmV, example: "8.539063"}
        SNR: {type: string, description: dB, example: "48"}
        dsoctets: {type: string}
        correcteds: {type: string}
        uncorrect: {type: string}
        index: {type: integer, example: 1}
      additionalProperties: true
    DsOfdmResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Freq_List:
              type: array
              items: {$ref: '#/components/schemas/DsOfdmChannel'}
          additionalProperties: true
    UsOfdmChannel:
      type: object
      description: One OFDMA upstream channel.
      properties:
        uschindex: {type: string, example: "1"}
        state: {type: string, example: OPERATE}
        frequency: {type: string, description: Hz, example: "22000000"}
        digAtten: {type: string, description: dB, example: "0.5792"}
        digAttenBo: {type: string}
        channelBw: {type: string, description: MHz, example: "58.8000"}
        repPower: {type: string, description: dBmV, example: "48.6526"}
        repPower1_6: {type: string, description: dBmV DOCSIS-3.0 equivalent, example: "33.0000"}
        fftVal: {type: string, example: 2K}
      additionalProperties: true
    UsOfdmResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Freq_List:
              type: array
              items: {$ref: '#/components/schemas/UsOfdmChannel'}
          additionalProperties: true
    DocsisLogEntry:
      type: object
      properties:
        index: {type: string}
        time: {type: string}
        type: {type: string}
        priority: {type: string}
        event: {type: string}
      additionalProperties: true
    DocsisLogResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Log_List:
              type: array
              items: {$ref: '#/components/schemas/DocsisLogEntry'}
          additionalProperties: true
    LteBackup:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            LTE_Backup_Enable: {type: string}
            LTE_Backup_Mode: {type: string}
            LTE_Connection: {type: string}
            LTE_ISP: {type: string}
            LTE_IMSI: {type: string}
            LTE_APN: {type: string}
            LTE_APN_Username: {type: string}
            LTE_APN_Password: {type: string}
            LTE_APN_Authentication: {type: string}
            LTE_APN_Auto: {type: string}
            LTE_APN_ProfileName: {type: string}
            LTE_SignalStrength: {type: string}
            LTE_WANIP: {type: string}
            Dongle_Vendor: {type: string}
            Dongle_IMEI: {type: string}
            Dongle_HardwareVersion: {type: string}
            Dongle_SoftwareVersion: {type: string}
            Dongle_RX_Monthly: {type: string}
            Dongle_TX_Monthly: {type: string}
          additionalProperties: true
    ReadyResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            ready: {type: string}
            status: {type: string}
          additionalProperties: true
    PortForwardRule:
      type: object
      properties:
        appName: {type: string}
        localIpAddr: {type: string}
        priStart: {type: string}
        priEnd: {type: string}
        protocol: {type: string}
        pubStart: {type: string}
        pubEnd: {type: string}
        remoteIpStar: {type: string}
        remoteIpEnd: {type: string}
        ruleOnOff: {type: string}
        enable: {type: string}
      additionalProperties: true
    PortForwardRules:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            RuleNumberOfEntries: {type: integer}
            Rules_List:
              type: array
              items: {$ref: '#/components/schemas/PortForwardRule'}
          additionalProperties: true
    PortForwardStatus:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            ipv4: {type: string}
            ipv6: {type: string}
          additionalProperties: true
    PortTriggerRule:
      type: object
      properties:
        appName: {type: string}
        priStart: {type: string}
        priEnd: {type: string}
        protocol: {type: string}
        pubStart: {type: string}
        pubEnd: {type: string}
        timeout: {type: string}
        twowayOnOff: {type: string}
        ruleOnOff: {type: string}
        enable: {type: string}
      additionalProperties: true
    PortTriggerRules:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            RuleNumberOfEntries: {type: integer}
            Rules_List:
              type: array
              items: {$ref: '#/components/schemas/PortTriggerRule'}
          additionalProperties: true
    PortTriggerStatus:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            ruleOnOff: {type: string}
            active: {type: string}
          additionalProperties: true
    MtaStatus:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            NumberOfSLIC: {type: string}
            voiceProtocol: {type: string}
            telDhcp: {type: string}
            telReg: {type: string}
            telSec: {type: string}
            telTftp: {type: string}
            Line1IMPU: {type: string}
            Line1RegState: {type: string}
            line1CallState: {type: string}
            Line2IMPU: {type: string}
            Line2RegState: {type: string}
            line2CallState: {type: string}
            Line3RegState: {type: string}
            line3CallState: {type: string}
            Line4RegState: {type: string}
            line4CallState: {type: string}
          additionalProperties: true
    MtaDhcp:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            mtaMacAddr: {type: string}
            mtaIpAddr: {type: string}
            mtaSubmask: {type: string}
            mtaGw: {type: string}
            mtaPriDns: {type: string}
            mtaSecDns: {type: string}
            mtaFQDN: {type: string}
            mtaKr: {type: string}
            mtaLeaseT: {type: string}
            mtaProvT: {type: string}
            mtaSnmp: {type: string}
          additionalProperties: true
    MtaLogEntry:
      type: object
      properties:
        index: {type: string}
        time: {type: string}
        type: {type: string}
        priority: {type: string}
        event: {type: string}
      additionalProperties: true
    MtaLog:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            Log_List:
              type: array
              items: {$ref: '#/components/schemas/MtaLogEntry'}
          additionalProperties: true
    MtaQualityMetricEntry:
      type: object
      properties:
        Index: {type: string}
        Line: {type: string}
        Call_Start_Time: {type: string}
        Call_End_Time: {type: string}
        Call_Duration: {type: string}
        Remote_IP_Address: {type: string}
        SNR: {type: string}
      additionalProperties: true
    MtaQualityMetric:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            QualityMetric_List:
              type: array
              items: {$ref: '#/components/schemas/MtaQualityMetricEntry'}
          additionalProperties: true
    WifiRadio:
      type: object
      properties:
        Radio_URI: {type: string, example: /1/Device/WiFi/Radios/1}
        vendor: {type: string}
        modelName: {type: string, example: CODA6X}
        band: {type: string, example: 2.4G}
        wlsOnOff: {type: string, enum: [ON, OFF]}
        wlsMode: {type: string, nullable: true}
        n_bandwidth: {type: string, example: 20/40MHZ}
        wlsChannel: {type: integer}
        wlsSecChannel: {type: string}
        autoChannel: {type: string, enum: [ON, OFF]}
        wlsDfsOnOff: {type: string}
        wlsCurrentChannel: {type: string}
        wlsWpsOnOff: {type: string}
        wlsDcsOnOff: {type: string}
        countryRegion: {type: string}
        hasGuest: {type: integer}
        showWlsMBtn: {type: string}
        bandsteer: {type: string}
        ssid_list: {type: array, items: {type: string}, nullable: true}
        ext: {type: string}
        bSomeItemsReadOnly: {type: string}
        igmpSnoop: {type: string}
      additionalProperties: true
    WifiRadios:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            RadioNumberOfEntries: {type: integer}
            Raidos_List:
              type: array
              description: Firmware spells the key `Raidos_List`.
              items: {$ref: '#/components/schemas/WifiRadio'}
          additionalProperties: true
    RadioAdvanced:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            bandsteering: {type: string, enum: [ON, OFF]}
            ssidName: {type: string}
            bgMode: {type: string}
            dfs: {type: string}
            enable11R: {type: string}
            igmpSnoop: {type: string}
            modelName: {type: string}
            modelType: {type: string}
            n_GuardInterval: {type: string}
            n_OperatingMode: {type: string}
            n_amsdu: {type: string}
            n_autoba: {type: string}
            n_badecline: {type: string}
            n_coexistence: {type: string}
            n_mcs: {type: string}
            n_rdg: {type: string}
            rx_stream: {type: string}
            tx_stream: {type: string}
            userType: {type: string}
          additionalProperties: true
    RadioAdvancedList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            AdvancedNumberOfEntries: {type: integer}
            Advanced_List:
              type: array
              items: {$ref: '#/components/schemas/RadioAdvanced'}
          additionalProperties: true
    AtfConfig:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            enable: {type: string, enum: [ON, OFF]}
            airtime: {type: string, description: AirTimePercent for the AP group.}
            strict: {type: string, enum: [ON, OFF]}
            atfPolicy: {type: string}
            atftype: {type: string}
            band: {type: string}
            wlsOnOff: {type: string}
          additionalProperties: true
    AtfSsid:
      type: object
      properties:
        band: {type: string}
        index: {type: string}
        ssid: {type: string}
        ssidatf: {type: string}
        wlsStatus: {type: string}
      additionalProperties: true
    AtfSsidList:
      allOf:
