        verifiedOn: "8.7.1.0.1b4"
        destructive: false
        models: []
      x-hitron-destructive: false
      description: "One 6 MHz window per call from the shared tuner, 300 points at 20 kHz spacing. The handler accepts at most one non-zero fractional digit (637.5, never 637.500); a value that misses its regex silently falls back to the 645/637.5/643.5 defaults. The returned window can still start up to 1.5 MHz away from fromFreq, so plot the frequencies in the payload, not the request."
