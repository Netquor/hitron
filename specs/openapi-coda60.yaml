openapi: "3.0.3"
info:
  title: "Hitron CODA6X console REST API (reverse engineered)"
  version: "8.7.1.0.1b4"
  description: |
    Not an official Hitron specification. Reconstructed from a static read of a real
    CODA6X firmware image (SquashFS rootfs mounted read-only; nothing executed from
    it) and then verified GET-by-GET against a live, customer-owned CODA60 running
    8.7.1.0.1b4 on 2026-11-26.

    Architecture: lighttpd + php-fpm serve a Fat-Free-Framework PHP app at
    www/hitron/. app/routes.ini maps URL patterns to app/controllers/*.php; those
    controllers call the RDK-B COSA bridge (extension=cosa.so) which speaks TR-181
    Device.*. Every path below is therefore a thin projection of a TR-181 subtree,
    not an independent API.

    Read surface, measured on 8.7.1.0.1b4: 52 working, 51 PHP-8 fatals, 5 session-gated, 1 verb-rejected, 3 untested.
    A PHP-8 fatal is a defect in the shipped controller (undefined array key,
    getInstanceIds vs getInstanceIDs, a parameter declared before a required one),
    not a request-shaping problem: it fails identically for the browser UI.

    Two responses on this platform are stubs and must not be read as capability
    evidence: /WiFi/* and /MTA/StatusInfo return 200 with empty strings or null
    hardware fields on a unit that has no radios or SLIC. Model/capability detection
    therefore keys on /deviceinfo's hw_model plus payload evidence, and each
    endpoint carries its `requires` capability in x-hitron.

    Every operation is tagged with x-hitron.state as measured against
    8.7.1.0.1b4. Five reads require the web UI session and one rejects GET;
    everything else, including /1/Device/Manage, answers anonymously. Only
    operations marked with `security` present a cookie. The attached model catalog
    (18 profiles, specs/models.json) is what src/hitron/adapters.py uses to
    decide which of these paths a given SKU should be asked for.
  contact:
    name: "Netquor SDN - internal reverse-engineering notes"
  license:
    name: "Private - Netquor internal"
externalDocs:
  description: "Unified Hitron KB (HT-EM5 + CODA6X + CODA-57)"
  url: "./KB.md"
servers:
  - url: "http://{host}"
    variables:
      host:
        default: "192.168.100.1"
        description: "The gateway's LAN IP."
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION.uid
    appTokenAuth:
      type: apiKey
      in: header
      name: ht-app-header
  schemas:
    Envelope:
      type: object
      description: "Every response wraps its payload in this envelope. errCode 000 is success; 001 is a rejected parameter or missing session; 005 is a verb the model does not support."
      properties:
        errCode:
          type: string
          example: "000"
        errMsg:
          type: string
    DeviceInfo:
      type: object
      description: "GET /deviceinfo (root telemetry route). The only place hw_model is populated on 8.7.1.0.1b4; this is what model detection keys on."
      properties:
        device_id:
          type: string
          description: "RF/device MAC"
        mso:
          type: string
        hw_model:
          type: string
          example: CODA60
        hw_manufacturer:
          type: string
        hardware_version:
          type: string
          example: "1A"
        software_version:
          type: string
          example: "8.7.1.0.1b4"
        serial_number:
          type: string
        parent:
          type: string
        connect_type:
          type: string
    CmVersion:
      type: object
      description: "GET /1/Device/CM/Version. Unauthenticated on this build."
    RouterSysInfo:
      type: object
      description: "GET /1/Device/Router/SysInfo. modelName/vendorName/deploymentName are null even when the device reports hw_model elsewhere."
      properties:
        hwVersion:
          type: string
        swVersion:
          type: string
        serialNumber:
          type: string
        systemTime:
          type: string
        rfMac:
          type: string
        systemUptime:
          type: string
    DocsisDs:
      type: object
      description: "One locked downstream SC-QAM channel."
      properties:
        portId:
          type: integer
        frequency:
          type: string
          description: Hz
        modulation:
          type: string
        signalStrength:
          type: string
          description: dBmV
        snr:
          type: string
          description: dB
        channelId:
          type: string
        dsoctets:
          type: string
        correcteds:
          type: string
        uncorrect:
          type: string
    DocsisUs:
      type: object
      properties:
        portId:
          type: integer
        frequency:
          type: string
        modtype:
          type: string
        signalStrength:
          type: string
        bandwidth:
          type: string
        channelId:
          type: string
        scdmaMode:
          type: string
    DocsisDsOfdm:
      type: object
      properties:
        receive:
          type: string
        ffttype:
          type: string
        Subcarr0freqFreq:
          type: string
        plclock:
          type: string
        ncplock:
          type: string
        mdc1lock:
          type: string
        plcpower:
          type: string
        SNR:
          type: string
        dsoctets:
          type: string
        correcteds:
          type: string
        uncorrect:
          type: string
        index:
          type: string
    DocsisUsOfdm:
      type: object
      properties:
        uschindex:
          type: string
        state:
          type: string
        frequency:
          type: string
        digAtten:
          type: string
        channelBw:
          type: string
        repPower:
          type: string
          description: dBmV
        repPower1_6:
          type: string
          description: "DOCSIS 3.0-equivalent reported power"
        fftVal:
          type: string
    DocsisLog:
      type: object
      properties:
        index:
          type: string
        time:
          type: string
        type:
          type: string
        priority:
          type: string
        event:
          type: string
    WifiWps:
      type: object
      description: "GET /1/Device/WiFi/WPS. Answers 200 on units with no radios; all state fields are empty strings. Treat a populated wlsWpsState24g/5g as the evidence a radio exists."
    WifiGuestSsid:
      type: object
      description: "GET /1/Device/WiFi/GuestSSID. bssid/ssidName are the radio-presence evidence; empty strings mean a stub response."
    MtaStatus:
      type: object
      description: "GET /1/Device/MTA/StatusInfo. NumberOfSLIC and the LineNRegState fields are null on a unit with no EMTA hardware even though the route returns 200."
      properties:
        telDhcp:
          type: string
        telSec:
          type: string
        telTftp:
          type: string
        telReg:
          type: string
        Line1RegState:
          type: string
          nullable: true
        Line2RegState:
          type: string
          nullable: true
        Line3RegState:
          type: string
          nullable: true
        Line4RegState:
          type: string
          nullable: true
        NumberOfSLIC:
          type: integer
          nullable: true
    MoCA:
      type: object
      description: "Field set from models/MoCA.php. password is plaintext on the device; it is deliberately not requested here."
      properties:
        moca_status:
          type: string
          enum:
            - "ON"
            - "OFF"
        fs_mode:
          type: string
        fs_channel:
          type: integer
        txpower:
          type: string
        beaconpwr:
          type: string
        nctype:
          type: string
          enum:
            - Preferred
            - "Auto Negotiated"
        mocaNTSecurity:
          type: string
          enum:
            - Enable
            - Disable
        fwVersion:
          type: string
        mocaMac:
          type: string
        coaxTx:
          type: string
        coaxRx:
          type: string
        mocaLink:
          type: string
    AdvancedSwitchPort:
      type: object
      description: "On-board Ethernet switch port. The live CODA60 reports exactly one (1Gbps, linked)."
      properties:
        portId:
          type: integer
        power:
          type: string
          enum:
            - "true"
            - "false"
        neg:
          type: string
        speed:
          type: string
          example: "1Gbps"
        duplex:
          type: string
        linked:
          type: string
    PnmBundle:
      type: object
      description: "Proactive Network Maintenance bundle from the root telemetry route. Arrays carry base64-encoded, vendor-encoded payloads (rxmer, us_pre_eq, mod_prof) keyed by channel_id."
      properties:
        mac:
          type: string
        timestamp:
          type: string
          description: "Unix seconds, device clock"
        rxmer:
          type: string
          description: "base64 vendor-encoded per-subcarrier MER"
        ch_est_coef:
          type: string
          description: "base64 channel-estimation coefficients"
        us_pre_eq:
          type: string
          description: "base64 upstream pre-equalization"
        mod_prof:
          type: string
          description: "base64 modulation profile"
      additionalProperties: true
    RegisterRequest:
      type: object
      required:
        - appid
        - seckey
      properties:
        appid:
          type: string
        seckey:
          type: string
          description: "RS256 JWT with jti, iss=Hitron, vendor (from Device.X_HITRON_COM_App.VendorList), model."
x-hitron:
  generated: "2026-11-26"
  generator: tools/gen_spec.py
  firmware: "8.7.1.0.1b4"
  modelCatalog: "./models.json"
  stateCounts:
    ok: 52
    php8: 51
    session: 5
    untested: 3
    verb: 1
  note: "Paths, methods, capability tags and states come from src/hitron/adapters.py. Do not edit the paths block by hand; run tools/gen_spec.py."
